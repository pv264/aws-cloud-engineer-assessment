# Keeps every pinned dependency current; each update runs the full CI.
# Tip: once actions are pinned to commit SHAs, Dependabot keeps the SHAs updated too.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories: ["/terraform", "/terraform/bootstrap"]
    schedule: { interval: weekly }
